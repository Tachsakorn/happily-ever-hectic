<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no + viewport-fit=cover: no pinch/double-tap zoom, draw under the notch/home bar and pad with safe-area insets instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hectic" />
    <meta name="theme-color" content="#fbeee6" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Happily Ever Hectic</title>
  </head>
  <body>
    <div id="app">
      <div id="game-layer"></div>
      <div id="ui-layer"></div>
      <div id="curtain" aria-hidden="true"><div class="curtain-heart"></div></div>
      <div id="rotate-overlay" aria-hidden="true">
        <div class="rotate-card">
          <div class="rotate-icon"></div>
          <p>Please turn your device sideways</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
